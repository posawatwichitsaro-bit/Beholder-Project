services:
  app:
    build: .
    ports:
      - "${BEHOLDER_BIND:-127.0.0.1}:${BEHOLDER_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://beholder:beholder@db:5432/beholder
      ASSET_DIR: /data/maps
      PUBLIC_ORIGIN: "${BEHOLDER_PUBLIC_ORIGIN:-}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - maps:/data/maps
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: beholder
      POSTGRES_PASSWORD: beholder
      POSTGRES_DB: beholder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beholder -d beholder"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database:
  maps:
